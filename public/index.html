<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BedWars - 起床战争</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- 游戏画布 -->
        <canvas id="game-canvas"></canvas>
        
        <!-- 玩家信息面板 -->
        <div id="player-info">
            <div class="info-section">
                <h3>玩家信息</h3>
                <p>名称: <span id="player-name">加载中...</span></p>
                <p>队伍: <span id="player-team">无</span></p>
                <p>健康: <span id="player-health">100</span>/100</p>
                <p>击杀: <span id="player-kills">0</span></p>
            </div>
            
            <div class="info-section">
                <h3>资源</h3>
                <p>🪨 铁锭: <span id="resource-iron">0</span></p>
                <p>🟡 金锭: <span id="resource-gold">0</span></p>
                <p>🔵 钻石: <span id="resource-diamond">0</span></p>
                <p>🟢 绿宝石: <span id="resource-emerald">0</span></p>
            </div>
        </div>
        
        <!-- 商店面板 -->
        <div id="shop-panel" class="hidden">
            <div class="shop-header">
                <h2>商店</h2>
                <button id="close-shop">×</button>
            </div>
            <div class="shop-tabs">
                <button class="shop-tab active" data-category="weapons">武器</button>
                <button class="shop-tab" data-category="armor">防具</button>
                <button class="shop-tab" data-category="tools">工具</button>
                <button class="shop-tab" data-category="blocks">方块</button>
                <button class="shop-tab" data-category="special">特殊</button>
            </div>
            <div class="shop-items" id="shop-items"></div>
        </div>
        
        <!-- 团队指令面板 -->
        <div id="team-commands-panel" class="hidden">
            <div class="commands-header">
                <h2>团队指令 (F键)</h2>
            </div>
            <div class="commands-list">
                <button class="command-btn" data-command="全员保护床">🛡️ 全员保护床</button>
                <button class="command-btn" data-command="全员出击">⚔️ 全员出击</button>
                <button class="command-btn" data-command="跟我走">👣 跟我走</button>
            </div>
        </div>
        
        <!-- 游戏开始界面 -->
        <div id="start-screen">
            <div class="start-content">
                <h1>BedWars</h1>
                <h2>起床战争</h2>
                <p>仿照我的世界起床战争游戏</p>
                <div class="start-form">
                    <input type="text" id="player-name-input" placeholder="输入你的名字" value="Player_" + Math.floor(Math.random() * 1000)>
                    <select id="team-select">
                        <option value="">自动分配队伍</option>
                        <option value="team_1">红队</option>
                        <option value="team_2">蓝队</option>
                        <option value="team_3">绿队</option>
                        <option value="team_4">黄队</option>
                    </select>
                    <button id="start-game">开始游戏</button>
                </div>
                <div class="game-info">
                    <h3>游戏说明</h3>
                    <p>• WASD 或 箭头键 移动</p>
                    <p>• 空格键 攻击</p>
                    <p>• E 键 打开商店</p>
                    <p>• F 键 团队指令</p>
                    <p>• 点击资源收集</p>
                    <p>• 破坏敌方床并消灭对方队伍</p>
                </div>
            </div>
        </div>
        
        <!-- 游戏结束界面 -->
        <div id="end-screen" class="hidden">
            <div class="end-content">
                <h1 id="winner-text">游戏结束</h1>
                <p id="winner-description"></p>
                <button id="restart-game">重新开始</button>
            </div>
        </div>
        
        <!-- 等待其他玩家界面 -->
        <div id="waiting-screen" class="hidden">
            <div class="waiting-content">
                <h2>等待其他玩家...</h2>
                <p>当前玩家: <span id="current-players">1</span></p>
                <p>最少需要 2 个玩家开始游戏</p>
                <button id="add-ai">添加AI玩家</button>
            </div>
        </div>
        
        <!-- 击杀通知 -->
        <div id="kill-feed"></div>
        
        <!-- 计时器 -->
        <div id="game-timer">00:00</div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
